time_units: generations

demes:
    - name: ANC
      description: Ancestral population
      epochs:
          - {end_time: 100e3, start_size: 10000}

    - name: B1
      ancestors: [ANC]
      epochs:
          - {end_time: 10e3, start_size: 5000}

    - name: B2
      ancestors: [ANC]
      epochs:
          - {end_time: 10e3, start_size: 5000}

    - name: B1C1
      ancestors: [B1]
      epochs:
          - {end_time: 1e3, start_size: 5000}

    - name: B1C2
      ancestors: [B1]
      epochs:
          - {end_time: 1e3, start_size: 5000}


    - name: B2C1
      ancestors: [B2]
      epochs:
          - {end_time: 1e3, start_size: 5000}

    - name: B2C2
      ancestors: [B2]
      epochs:
          - {end_time: 1e3, start_size: 5000}


    - name: B1C1D1
      ancestors: [B1C1]
      epochs:
          - {end_time: 0, start_size: 5000}


    - name: B1C2D1
      ancestors: [B1C2]
      epochs:
          - {end_time: 0, start_size: 5000}

    - name: B2C1D1
      ancestors: [B2C1]
      epochs:
          - {end_time: 0, start_size: 5000}

    - name: B2C2D1
      ancestors: [B2C1]
      epochs:
          - {end_time: 0, start_size: 5000}



    - name: B1C1D2
      ancestors: [B1C1]
      epochs:
          - {end_time: 0, start_size: 5000}


    - name: B1C2D2
      ancestors: [B1C2]
      epochs:
          - {end_time: 0, start_size: 5000}



    - name: B2C1D2
      ancestors: [B2C1]
      epochs:
          - {end_time: 0, start_size: 5000}

    - name: B2C2D2
      ancestors: [B2C1]
      epochs:
          - {end_time: 0, start_size: 5000}


migrations:
    - {demes: [B1C1,B1C2], rate: 1e-03}
    - {demes: [B2C1,B2C2], rate: 1e-03}
    - {demes: [B1,B2], rate: 5e-04}
    - {demes: [B1C1D1,B1C1D2], rate: 1e-02}
    - {demes: [B1C2D1,B1C2D2], rate: 1e-02}
    - {demes: [B2C1D1,B2C1D2], rate: 1e-02}
    - {demes: [B2C2D1,B2C2D2], rate: 1e-02}
